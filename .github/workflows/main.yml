name: Java CI/CD Pipeline

on: 
  push:
    branches:
      - main # Fixed: Added missing space

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2 & 3: Setup Java & Native Optimized Maven Caching
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with: 
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven' # Replaced your manually configured block with native, reliable caching

      # Step 4: Build package efficiently
      - name: Build with Maven
        run: mvn -B clean package # Added -B flag for cleaner CI logging

      # Step 5: Simulated deployment
      - name: Deploy Setup
        run: |
          echo "Deploying the application"
          echo "Artifact Ready for deploy"
