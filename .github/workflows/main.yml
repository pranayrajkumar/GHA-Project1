name: Java CI/CD Pipeline

on: 
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Java using the updated stable v5 Action
      - name: Setup JDK 17
        uses: actions/setup-java@v5 # Upgraded to v5 to fix deprecation warning
        with: 
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven' # Automatically manages caching cleanly

      # Step 3: Run Maven with progress flags so it won't look stuck
      - name: Build with Maven
        # Removed clean (unless needed) to maximize cache performance.
        # Removed -B if you want to explicitly see real-time download progress bars.
        run: mvn package 

      # Step 4: Simulated deployment
      - name: Deploy Setup
        run: |
          echo "Deploying the application"
          echo "Artifact Ready for deploy"
